trigger: none
pr: none

stages:

# ============================================================
# Stage 1 - Discover expired secrets
# ============================================================
- stage: DiscoverExpiredSecrets
  displayName: 'Discover Expired Secrets'

  jobs:
  - job: Discover
    displayName: 'Generate expired.txt'

    pool:
      vmImage: ubuntu-latest

    steps:
    - checkout: self

    - bash: |
        echo "Before running script"
        pwd
        ls -lah
        ls -lah scripts
      displayName: 'List files before execution'

    - bash: |
        chmod +x scripts/check-expired-secrets.sh
      displayName: 'Make script executable'

    - task: AzureCLI@2
      displayName: 'Check expired App Registration secrets'
      inputs:
        azureSubscription: 'Strategic Platform - non-live'
        scriptType: bash
        scriptLocation: scriptPath
        scriptPath: '$(Build.SourcesDirectory)/scripts/check-expired-secrets.sh'

    - bash: |
        echo "After running script"
        pwd
        ls -lah

        echo ""
        echo "Looking for expired.txt"
        find . -name "expired.txt" -type f

        echo ""
        echo "Contents:"
        cat expired.txt
      displayName: 'Verify expired.txt'

    - task: PublishPipelineArtifact@1
      displayName: 'Publish expired.txt'
      inputs:
        targetPath: '$(Build.SourcesDirectory)/expired.txt'
        artifact: 'expired-secrets'
        publishLocation: 'pipeline'


# ============================================================
# Stage 2 - Approval + Delete
# ============================================================
- stage: DeleteExpiredSecrets
  displayName: 'Delete Expired Secrets'
  dependsOn: DiscoverExpiredSecrets
  condition: succeeded()

  jobs:
  - deployment: DeleteSecrets
    displayName: 'Delete Expired Secrets'
    environment: 'NonLive'   # Approval configured here

    pool:
      vmImage: ubuntu-latest

    strategy:
      runOnce:
        deploy:
          steps:

          - checkout: self

          - task: DownloadPipelineArtifact@2
            displayName: 'Download expired.txt'
            inputs:
              artifact: 'expired-secrets'
              path: '$(Pipeline.Workspace)/expired-secrets'

          - bash: |
              echo "Downloaded files:"
              ls -lah $(Pipeline.Workspace)/expired-secrets

              echo ""
              echo "Contents of expired.txt:"
              cat $(Pipeline.Workspace)/expired-secrets/expired.txt
            displayName: 'Verify downloaded artifact'

          - bash: |
              cp $(Pipeline.Workspace)/expired-secrets/expired.txt .
              chmod +x scripts/delete-expired-secrets.sh
            displayName: 'Prepare delete script'

          - task: AzureCLI@2
            displayName: 'Delete expired App Registration secrets'
            inputs:
              azureSubscription: 'Strategic Platform - non-live'
              scriptType: bash
              scriptLocation: scriptPath
              scriptPath: '$(Build.SourcesDirectory)/scripts/delete-expired-secrets.sh'